name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Deploy to Firebase Hosting with FIREBASE_TOKEN
        if: ${{ secrets.FIREBASE_TOKEN != '' }}
        run: npx --yes firebase-tools deploy --only hosting --project gen-lang-client-0214744546 --token "${{ secrets.FIREBASE_TOKEN }}" --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deploy to Firebase Hosting with Service Account (fallback)
        if: ${{ secrets.FIREBASE_TOKEN == '' && (secrets.FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0214744546 != '' || secrets.FIREBASE_SERVICE_ACCOUNT != '' || secrets.GCP_SA_KEY != '') }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0214744546 || secrets.FIREBASE_SERVICE_ACCOUNT || secrets.GCP_SA_KEY }}'
          channelId: live
          projectId: gen-lang-client-0214744546
