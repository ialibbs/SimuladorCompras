name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_AUTH_SECRET: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [[ "$FIREBASE_AUTH_SECRET" =~ ^[[:space:]]*\{ ]]; then
            echo "Google Service Account JSON detectado no secret."
            echo "$FIREBASE_AUTH_SECRET" > /tmp/firebase_sa_key.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase_sa_key.json
            npx --yes firebase-tools deploy --only hosting --project gen-lang-client-0214744546 --debug
          else
            echo "Token CLI de autenticacao detectado no secret."
            export FIREBASE_TOKEN="$FIREBASE_AUTH_SECRET"
            npx --yes firebase-tools deploy --only hosting --project gen-lang-client-0214744546 --debug
          fi
