name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via Firebase Service Account
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0214744546 != '' || secrets.FIREBASE_SERVICE_ACCOUNT != '' || secrets.GCP_SA_KEY != '' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0214744546 || secrets.FIREBASE_SERVICE_ACCOUNT || secrets.GCP_SA_KEY }}'
          channelId: live
          projectId: gen-lang-client-0214744546
          target: libbssimulador

      - name: Deploy via Firebase CLI Token (Alternative)
        if: ${{ (secrets.FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0214744546 == '' && secrets.FIREBASE_SERVICE_ACCOUNT == '' && secrets.GCP_SA_KEY == '') && secrets.FIREBASE_TOKEN != '' }}
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting:libbssimulador --project gen-lang-client-0214744546
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
